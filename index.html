<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower with Bee</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.1.0/anime.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: hsl(40, 45%, 80%);
        color: hsl(0, 0%, 15%);
      }

      svg {
        color: hsl(0, 0%, 20%);
        width: 80vw;
        max-width: 35rem;
        width: 100%;
        height: auto;
        display: block;
      }

      svg#bee {
        color: hsl(0, 0%, 10%);
        position: absolute;
        width: 50px;
        height: auto;
      }

      .text {
        font-size: clamp(2rem, 4vw, 3rem);
        width: 100%;
        text-align: center;
        position: fixed;
        top: 23%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        animation: fade-in forwards 0.8s;
        animation-delay: 2s;
      }

      .music-toggle {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        width: 3.5rem;
        height: 3.5rem;
        border: none;
        border-radius: 50%;
        background: linear-gradient(135deg, #e8c15d, #f3d779);
        box-shadow: 0 10px 22px rgba(194, 139, 33, 0.38);
        cursor: pointer;
        z-index: 30;
        display: grid;
        place-items: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .music-toggle:hover {
        transform: scale(1.04);
        box-shadow: 0 12px 26px rgba(194, 139, 33, 0.46);
      }

      .music-toggle .icon {
        width: 0;
        height: 0;
        border-top: 0.55rem solid transparent;
        border-bottom: 0.55rem solid transparent;
        border-left: 0.9rem solid #fff9ef;
        margin-left: 0.25rem;
      }

      .music-toggle.is-playing .icon {
        width: 0.9rem;
        height: 1.1rem;
        border: 0;
        margin-left: 0;
        position: relative;
      }

      .music-toggle.is-playing .icon::before,
      .music-toggle.is-playing .icon::after {
        content: "";
        position: absolute;
        top: 0;
        width: 0.28rem;
        height: 1.1rem;
        background: #fff9ef;
        border-radius: 0.2rem;
      }

      .music-toggle.is-playing .icon::before {
        left: 0;
      }

      .music-toggle.is-playing .icon::after {
        right: 0;
      }

      audio {
        display: none;
      }

      @keyframes fade-in {
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @media (width <= 600px) {
        .text {
          top: 28%;
        }
      }
    </style>
  </head>
  <body>
    <audio
      id="bgm"
      src="Olivia Rodrigo - honeybee Lyric Video.mp3"
      preload="auto"
      loop
      playsinline
    ></audio>

    <button
      id="musicToggle"
      class="music-toggle"
      type="button"
      aria-label="Play music"
    >
      <span class="icon"></span>
    </button>

    <h1 class="text">
      buattt pacaaaaaaallllllll atuuuuuuuuu tersayaaaaaaaaanggggggggg!
    </h1>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="-25 0 150 100"
      width="150"
      height="100"
    >
      <defs>
        <mask id="mask-petals">
          <rect width="100" height="100" fill="hsl(0, 0%, 100%)" />
          <g transform="translate(50 40)">
            <g class="petals">
              <circle r="8" fill="hsl(0, 0%, 0%)" />
            </g>
          </g>
        </mask>
      </defs>
      <g transform="translate(50 98)">
        <g class="stem" transform="scale(1 1)">
          <g fill="hsl(120, 60%, 30%)">
            <g class="leaf" transform="rotate(45)">
              <path d="M 0 0 c 20 -8 15 -32 0 -42 -15 10 -20 34 0 42" />
            </g>
            <g transform="scale(-1 1)">
              <g class="leaf" transform="rotate(45)">
                <path d="M 0 0 c 20 -8 15 -32 0 -42 -15 10 -20 34 0 42" />
              </g>
            </g>
          </g>
        </g>
      </g>

      <g mask="url(#mask-petals)">
        <g transform="translate(50 40)">
          <g fill="hsl(340, 80%, 65%)">
            <g class="petals">
              <ellipse transform="translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(22.5) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(45) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(67.5) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(90) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(112.5) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(135) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(157.5) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(180) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(202.5) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(225) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(247.5) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(270) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(292.5) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(315) translate(0 -18)" rx="3" ry="14" />
              <ellipse transform="rotate(337.5) translate(0 -18)" rx="3" ry="14" />
            </g>
          </g>
        </g>
      </g>

      <g transform="translate(50 40)">
        <circle r="8" fill="hsl(42, 100%, 65%)" />
        <circle r="4" fill="hsl(34, 100%, 55%)" />
      </g>

      <path
        id="path"
        stroke="none"
        fill="none"
        d="M -25 -20 a 30 30 0 0 0 60 0 30 30 0 0 0 -60 0 30 30 0 0 1 -60 0 30 30 0 0 1 60 0"
      />
    </svg>

    <svg id="bee" viewBox="-10.5 -10.5 21 21" style="width: 50px; height: auto">
      <g transform="rotate(90) translate(0 -4)">
        <g stroke="currentColor">
          <circle fill="currentColor" r="4" stroke-width="2.5" />
          <g
            fill="none"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path transform="rotate(45) translate(0 -4)" d="M 0 0 v -3" />
            <path transform="rotate(-45) translate(0 -4)" d="M 0 0 v -3" />
            <g fill="hsl(200, 80%, 90%)">
              <path
                transform="rotate(15)"
                d="M 0 0 h 7 a 3 3 0 0 1 0 6 q -4 0 -7 -6"
              />
              <path
                transform="scale(-1 1) rotate(15)"
                d="M 0 0 h 7 a 3 3 0 0 1 0 6 q -4 0 -7 -6"
              />
            </g>
            <g fill="hsl(50, 80%, 50%)">
              <path d="M 0 0 c 2 6 8 10 0 12 -8 -2 -2 -6 0 -12" />
            </g>
          </g>
        </g>
      </g>
    </svg>

    <script>
      const audio = document.getElementById("bgm");
      const musicToggle = document.getElementById("musicToggle");

      const updateMusicButton = () => {
        if (!musicToggle) return;
        const isPlaying = audio && !audio.paused;
        musicToggle.classList.toggle("is-playing", isPlaying);
        musicToggle.setAttribute("aria-label", isPlaying ? "Pause music" : "Play music");
      };

      const startMusic = async () => {
        if (!audio) return;
        audio.volume = 0.45;

        try {
          await audio.play();
          updateMusicButton();
        } catch (error) {
          console.warn("Audio blocked until user interaction:", error);
        }
      };

      const stopMusic = () => {
        if (!audio) return;
        audio.pause();
        updateMusicButton();
      };

      if (musicToggle) {
        musicToggle.addEventListener("click", async () => {
          if (!audio) return;

          if (audio.paused) {
            await startMusic();
          } else {
            stopMusic();
          }
        });
      }

      document.addEventListener("pointerdown", startMusic, { once: true });
      document.addEventListener("touchstart", startMusic, { once: true });

      if (audio) {
        audio.addEventListener("play", updateMusicButton);
        audio.addEventListener("pause", updateMusicButton);
        audio.addEventListener("error", () => {
          if (musicToggle) {
            musicToggle.disabled = true;
            musicToggle.classList.remove("is-playing");
            musicToggle.innerHTML = "!";
          }
        });
      }

      updateMusicButton();

      const path = anime.path("#path");

      const timeline = anime.timeline({
        easing: "easeInOutExpo",
        duration: 1000,
        complete: () => {
          anime({
            targets: ".leaf",
            rotate: 40,
            duration: 3000,
            loop: true,
            direction: "alternate",
            easing: "easeInOutQuad",
          });
          anime({
            targets: ".petals",
            scale: 1.05,
            duration: 6000,
            loop: true,
            direction: "alternate",
            easing: "easeInOutQuad",
          });
        },
      });

      timeline.add({
        targets: ".stem",
        scale: [0, 1],
      });

      timeline.add({
        targets: ".leaf",
        rotate: [0, 45],
      });
      timeline.add(
        {
          targets: ".petals",
          scale: [0, 1],
        },
        "-=1000",
      );

      timeline.add(
        {
          targets: "#bee",
          opacity: [0, 1],
        },
        "-=750",
      );

      anime({
        targets: "#bee",
        translateX: path("x"),
        translateY: path("y"),
        rotate: path("angle"),
        loop: true,
        duration: 12500,
        easing: "linear",
      });
    </script>
  </body>
</html>
